[book]
title = "The Grove"
description = "The Grove: the first network of organisations running on an operating system for organisations without a boss. The design, the reasons behind it, and how we decided, written while it's being built."
authors = ["Mark Spall"]
language = "en"
src = "src"

[output.html]
additional-css = ["theme/grove.css"]
git-repository-url = "https://github.com/markaspall/the-grove-book"
edit-url-template = "https://github.com/markaspall/the-grove-book/edit/main/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
